services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_MODE: platform
    depends_on:
      - api
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file:
      - .env.container.example
    environment:
      DATABASE_URL: postgres://airman_playbook:airman_playbook@db:5432/airman_playbook
      MEDIA_STORAGE_DIR: /data/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - airman_playbook_media:/data/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airman_playbook
      POSTGRES_USER: airman_playbook
      POSTGRES_PASSWORD: airman_playbook
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airman_playbook -d airman_playbook"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - airman_playbook_pg:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - edge
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  airman_playbook_pg:
  airman_playbook_media:
